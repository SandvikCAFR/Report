<main class="wrap"><section class="sheet">
<div class="head"><div class="logoBox"><img src="Sandvik.png" alt="Sandvik"></div><div class="titleBox"><div class="titleText"><h1>Light Vehicle Pre-Start Check</h1></div><div class="precheckHome" aria-hidden="true"></div></div></div>
<div class="meta"><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>Vehicle / LV Number</label><input id="vehicle"></div><div class="field"><label>Kilometer Reading</label><input id="km" inputmode="numeric"></div><div class="field"><label>Site</label><input id="section"></div></div>
<div class="checks"><div class="checkTable"><div class="th"><span>No.</span><span>Item to Check</span><span>Good</span><span>Faulty</span></div><div id="leftChecks"></div></div><div class="checkTable"><div class="th"><span>No.</span><span>Item to Check</span><span>Good</span><span>Faulty</span></div><div id="rightChecks"></div></div></div><table class="print-check-table" aria-hidden="true"><colgroup><col class="pc-no"><col class="pc-item"><col class="pc-good"><col class="pc-fault"><col class="pc-no"><col class="pc-item"><col class="pc-good"><col class="pc-fault"></colgroup><thead><tr><th>No.</th><th>Item to Check</th><th>Good</th><th>Faulty</th><th>No.</th><th>Item to Check</th><th>Good</th><th>Faulty</th></tr></thead><tbody id="printChecksBody"></tbody></table>
<div class="notes single"><div><label>Comments</label><textarea id="comments" placeholder="Record defects, observations or actions required..."></textarea></div></div>
<div class="signatures two"><div class="sig"><label>Driver Name</label><input id="driverName" placeholder="Type full name"><label class="sigLabel">Driver Signature</label><div class="signaturePad"><canvas id="driverSig" aria-label="Driver signature pad"></canvas><div class="signatureControls"><button type="button" class="signatureAdd" data-add-sig="driverSig">ADD SIGNATURE</button><button type="button" class="signatureDone" data-done-sig="driverSig">DONE</button><button type="button" class="clearSig" data-clear-sig="driverSig">Clear signature</button></div></div></div><div class="sig"><label>Supervisor Name</label><input id="supervisorName" placeholder="Type full name"><label class="sigLabel">Supervisor Signature</label><div class="signaturePad"><canvas id="supervisorSig" aria-label="Supervisor signature pad"></canvas><div class="signatureControls"><button type="button" class="signatureAdd" data-add-sig="supervisorSig">ADD SIGNATURE</button><button type="button" class="signatureDone" data-done-sig="supervisorSig">DONE</button><button type="button" class="clearSig" data-clear-sig="supervisorSig">Clear signature</button></div></div></div></div>
</section></main>
<div class="actions"><button type="button" id="saveBtn">SAVE DRAFT</button><button class="light" type="button" id="clearBtn">CLEAR</button><button type="button" id="sendBtn">SEND / PDF</button></div><div class="privacy">Draft data is stored only on this device.</div>
<script>
const items=['Check Engine Oil Level','Check Radiator Coolant Level','Check Power Steering Fluid Level','Check Clutch Fluid Level','Check Window Washer Water Level','Inspect All V-Belts','Check Battery and Clamps','Check for Visible Oil Leaks','Inspect All Windows','Inspect All Mirrors','Check All Lights & Indicators','Record Vehicle Body Damage','Inspect Tyre Condition','Inspect Wheel Nuts','Ensure License and Insurance is Valid','Inspect Seat Belt','Test Horn','Check for Warning Signs on Cluster','Test Foot & Hand Brake','Ensure Jack & Wheel Spanners is Available','Ensure Triangles and 1st Aid Kit is Available','Ensure Fire Extinguisher is Inspected & in Order','2-Way Radio','Beacon Light'];
const left=document.getElementById('leftChecks'),right=document.getElementById('rightChecks');
function row(item,i){const n=i+1;return `<div class="row"><span class="num">${n}</span><span class="item">${item}</span><label class="status good"><input type="radio" name="check${n}" value="good" aria-label="${item} good"></label><label class="status fault"><input type="radio" name="check${n}" value="faulty" aria-label="${item} faulty"></label></div>`};
items.slice(0,12).forEach((x,i)=>left.insertAdjacentHTML('beforeend',row(x,i)));items.slice(12).forEach((x,i)=>right.insertAdjacentHTML('beforeend',row(x,i+12)));

function renderPrintTable(){const body=document.getElementById('printChecksBody');body.innerHTML='';for(let i=0;i<12;i++){const li=i,ri=i+12;const lg=document.querySelector(`input[name="check${li+1}"][value="good"]`)?.checked,lf=document.querySelector(`input[name="check${li+1}"][value="faulty"]`)?.checked,rg=document.querySelector(`input[name="check${ri+1}"][value="good"]`)?.checked,rf=document.querySelector(`input[name="check${ri+1}"][value="faulty"]`)?.checked;body.insertAdjacentHTML('beforeend',`<tr><td class="pc-num">${li+1}</td><td class="pc-text">${items[li]}</td><td class="pc-mark"><span class="print-mark good ${lg?'checked':''}"></span></td><td class="pc-mark"><span class="print-mark fault ${lf?'checked':''}"></span></td><td class="pc-num">${ri+1}</td><td class="pc-text">${items[ri]}</td><td class="pc-mark"><span class="print-mark good ${rg?'checked':''}"></span></td><td class="pc-mark"><span class="print-mark fault ${rf?'checked':''}"></span></td></tr>`)} }
const ids=['date','vehicle','km','section','comments','supervisorName','driverName'];const KEY='sandvikVehiclePreCheckDraft';
function syncSig(){}
function data(){const v={};ids.forEach(id=>v[id]=document.getElementById(id).value);v.driverSignature=exportSignature('driverSig');v.supervisorSignature=exportSignature('supervisorSig');v.checkDate=new Date().toISOString().slice(0,10);v.checks={};document.querySelectorAll('input[type=radio]:checked').forEach(el=>v.checks[el.name]=el.value);return v}
function setupSignature(id){const c=document.getElementById(id),ctx=c.getContext('2d');let drawing=false,last=null;function resize(){const data=c.width?c.toDataURL():null,r=c.getBoundingClientRect(),dpr=Math.max(1,window.devicePixelRatio||1);c.width=Math.max(1,Math.round(r.width*dpr));c.height=Math.max(1,Math.round(r.height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';if(data)loadSignature(id,data)}function point(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}c.addEventListener('pointerdown',e=>{if(!c.parentElement.classList.contains('signature-active'))return;drawing=true;last=point(e);c.setPointerCapture(e.pointerId);e.preventDefault()});c.addEventListener('pointermove',e=>{if(!drawing)return;const q=point(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(q.x,q.y);ctx.stroke();last=q;c.parentElement.classList.add('signed');e.preventDefault()});const end=()=>{if(drawing){drawing=false;localStorage.setItem(KEY,JSON.stringify(data()))}};c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);resize();window.addEventListener('resize',resize)}function exportSignature(id){const c=document.getElementById(id);return c&&c.parentElement.classList.contains('signed')?c.toDataURL('image/png'):''}function clearSignature(id,save=true){const c=document.getElementById(id),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);c.parentElement.classList.remove('signed');if(save)localStorage.setItem(KEY,JSON.stringify(data()))}function loadSignature(id,url){if(!url)return;const c=document.getElementById(id),ctx=c.getContext('2d'),img=new Image();img.onload=()=>{const dpr=Math.max(1,window.devicePixelRatio||1);ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width/dpr,c.height/dpr);c.parentElement.classList.add('signed')};img.src=url}setupSignature('driverSig');setupSignature('supervisorSig');document.querySelectorAll('[data-add-sig]').forEach(b=>b.addEventListener('click',()=>{document.getElementById(b.dataset.addSig).parentElement.classList.add('signature-active')}));document.querySelectorAll('[data-done-sig]').forEach(b=>b.addEventListener('click',()=>{document.getElementById(b.dataset.doneSig).parentElement.classList.remove('signature-active');localStorage.setItem(KEY,JSON.stringify(data()))}));document.querySelectorAll('[data-clear-sig]').forEach(b=>b.addEventListener('click',()=>clearSignature(b.dataset.clearSig)));function restore(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(!v)return;ids.forEach(id=>document.getElementById(id).value=v[id]||'');const today=new Date().toISOString().slice(0,10);if(v.checkDate===today){Object.entries(v.checks||{}).forEach(([n,val])=>{const e=document.querySelector(`input[name="${n}"][value="${val}"]`);if(e)e.checked=true})}else{v.checks={};v.comments='';v.km='';v.date=today;v.checkDate=today;localStorage.setItem(KEY,JSON.stringify(v));date.value=today;comments.value='';km.value=''}requestAnimationFrame(()=>{loadSignature('driverSig',v.driverSignature);loadSignature('supervisorSig',v.supervisorSignature)})}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify(data()));alert('Draft saved on this device.')}saveBtn.onclick=save;clearBtn.onclick=()=>{if(confirm('Clear this pre-check?')){const keepDriver=driverName.value,keepVehicle=vehicle.value,keepSite=section.value;document.querySelectorAll('input[type=radio]').forEach(e=>e.checked=false);date.value=new Date().toISOString().slice(0,10);km.value='';comments.value='';supervisorName.value='';clearSignature('supervisorSig',false);driverName.value=keepDriver;vehicle.value=keepVehicle;section.value=keepSite;localStorage.setItem(KEY,JSON.stringify(data()))}};sendBtn.onclick=()=>{localStorage.setItem(KEY,JSON.stringify(data()));renderPrintTable();window.print()};ids.forEach(id=>document.getElementById(id).addEventListener('input',()=>localStorage.setItem(KEY,JSON.stringify(data()))));document.addEventListener('change',e=>{if(e.target.matches('input[type=radio]'))localStorage.setItem(KEY,JSON.stringify(data()))});
let radioWasChecked=false;document.addEventListener('pointerdown',e=>{if(e.target.matches('input[type=radio]'))radioWasChecked=e.target.checked});document.addEventListener('click',e=>{if(e.target.matches('input[type=radio]')&&radioWasChecked){e.target.checked=false;radioWasChecked=false;localStorage.setItem(KEY,JSON.stringify(data()))}});
restore();renderPrintTable();window.addEventListener('beforeprint',renderPrintTable);if(!date.value)date.value=new Date().toISOString().slice(0,10);
</script>
</body></html>
